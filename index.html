<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>3D粒子蛋糕 · 星辰</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: #06060f;
        }
        .birthday-text{
            position: fixed;
            bottom: 10vh;
            width:100%;
            text-align:center;
            font-size: clamp(26px,7vw,44px);
            color: #ffdd77;
            font-weight:bold;
            z-index:10;
            pointer-events:none;
            opacity:0;
            transition: opacity 2s ease;
        }
        .birthday-text.show{
            opacity:1;
        }
    </style>
</head>
<body>
    <div class="birthday-text" id="birthText">祝偏执生日快乐</div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        const birthTextDom = document.getElementById("birthText");
        let animStarted = false;
        let startTime = 0;

        // 同域音频（mp3和html放同一目录）
        let bgAudio = null;
        const AUDIO_VOLUME = 0.75;
        const AUDIO_SRC = "./1792042036066.mp3";

        function showBirthText(){
            birthTextDom.classList.add("show");
        }

        // 基础场景
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x06060f);
        scene.fog = new THREE.FogExp2(0x06060f, 0.0022);
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(3.2, 2.4, 5.2);
        camera.lookAt(0, 1.2, 0);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ReinhardToneMapping;
        renderer.toneMappingExposure = 1.0;
        document.body.appendChild(renderer.domElement);

        const renderScene = new RenderPass(scene, camera);
        const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.72, 0.28, 0.16);
        bloomPass.threshold = 0.12;
        bloomPass.strength = 0.72;
        bloomPass.radius = 0.42;
        const effectComposer = new EffectComposer(renderer);
        effectComposer.addPass(renderScene);
        effectComposer.addPass(bloomPass);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.06;
        controls.autoRotate = false;
        controls.enableZoom = true;
        controls.zoomSpeed = 1.2;
        controls.rotateSpeed = 1.2;
        controls.target.set(0, 1.2, 0);

        const ambientLight = new THREE.AmbientLight(0x111122, 0.08);
        scene.add(ambientLight);

        // 背景星空
        const starCount = 1600;
        const starGeo = new THREE.BufferGeometry();
        const starPos = [];
        for (let i = 0; i < starCount; i++) {
            starPos.push((Math.random() - 0.5) * 200);
            starPos.push((Math.random() - 0.5) * 100);
            starPos.push((Math.random() - 0.5) * 80 - 40);
        }
        starGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(starPos), 3));
        const starMat = new THREE.PointsMaterial({ color: 0xaaccff, size: 0.07, transparent: true, opacity: 0.4 });
        const stars = new THREE.Points(starGeo, starMat);
        scene.add(stars);

        // ========== 蓝色引导环 ==========
        const guideRingGroup = new THREE.Group();
        const ringGeo = new THREE.TorusGeometry(1.42, 0.032, 24, 180);
        const ringMat = new THREE.MeshBasicMaterial({
            color:0x33bbff, transparent:true, opacity:0.92, blending:THREE.AdditiveBlending, depthWrite:false
        });
        const ringMesh = new THREE.Mesh(ringGeo, ringMat);
        ringMesh.rotation.x = Math.PI/2;
        guideRingGroup.add(ringMesh);
        guideRingGroup.position.y = -0.75;
        scene.add(guideRingGroup);

        // ========== 粒子系统 ==========
        const PARTICLE_COUNT = 8200;
        const targetPos = [];
        const startPos = [];
        const moveDelay = [];   // 启动延迟：目标y越高，延迟越大 → 从底向上依次动
        const colorList = [];

        // 生成蛋糕目标点
        function getCakeTarget(){
            const r = Math.random();
            let y,rad;
            if(r < 0.32){
                y = -0.36 + Math.random()*0.58;
                rad = 0.94 + Math.random()*0.20;
            }else if(r < 0.60){
                y = 0.21 + Math.random()*0.43;
                rad = 0.69 + Math.random()*0.18;
            }else if(r < 0.84){
                y = 0.63 + Math.random()*0.37;
                rad = 0.49 + Math.random()*0.17;
            }else{
                y = 0.99 + Math.random()*0.53;
                rad = 0.02 + Math.random()*0.13;
            }
            const ang = Math.PI*2*Math.random();
            return [Math.cos(ang)*rad, y, Math.sin(ang)*rad];
        }

        for(let i=0;i<PARTICLE_COUNT;i++){
            const [tx,ty,tz] = getCakeTarget();
            targetPos.push(tx,ty,tz);
            // 底部散开起点
            const ang = Math.PI*2*Math.random();
            const sr = 0.45 + Math.random()*1.8;
            startPos.push(Math.cos(ang)*sr, -0.62 + Math.random()*0.35, Math.sin(ang)*sr);
            // 核心：y越大，延迟越长 → **从下往上缓慢依次激活**
            moveDelay.push( ty * 5.0 + Math.random() * 0.9 );

            // 蛋糕配色
            let R=0.93,G=0.63,B=0.39;
            if(ty>1.32){ R=1.0; G=0.56; B=0.23; }
            colorList.push(R,G,B);
        }

        const pGeo = new THREE.BufferGeometry();
        const pPosArr = new Float32Array(PARTICLE_COUNT*3);
        for(let i=0;i<PARTICLE_COUNT;i++){
            pPosArr[i*3]   = startPos[i*3];
            pPosArr[i*3+1] = startPos[i*3+1];
            pPosArr[i*3+2] = startPos[i*3+2];
        }
        pGeo.setAttribute('position', new THREE.BufferAttribute(pPosArr,3));
        pGeo.setAttribute('color', new THREE.BufferAttribute(new Float32Array(colorList),3));

        const pMat = new THREE.PointsMaterial({
            size:0.044,
            vertexColors:true,
            blending:THREE.AdditiveBlending,
            transparent:true,
            depthWrite:false
        });
        const particles = new THREE.Points(pGeo, pMat);
        scene.add(particles);
        const posAttr = particles.geometry.attributes.position;
        const pa = posAttr.array;

        // 平缓缓动，无夸张弹跳，保证移动端稳定
        function easeSlow(t){
            return t < 0.5 ? 2*t*t : -1 + t*(4-2*t);
        }

        function startAnim(){
            if(animStarted) return;
            animStarted = true;
            startTime = performance.now() / 1000;
            console.log("✅动画开始");
            bgAudio = new Audio(AUDIO_SRC);
            bgAudio.volume = AUDIO_VOLUME;
            bgAudio.play().catch(err=>{
                console.log("音频播放失败",err);
                alert("🔇音频未播放，再次点击画面试试");
            });
        }

        function loop(timeMs){
            requestAnimationFrame(loop);
            controls.update();
            ringMesh.rotation.z += 0.009;

            if(animStarted){
                const nowSec = timeMs / 1000 - startTime;
                // 蓝圈非常缓慢上升，总时长 12秒
                const ringTotalTime = 9.0;
                const ringY = -0.75 + Math.min(1.0, nowSec / ringTotalTime) * 2.55;
                guideRingGroup.position.y = ringY;

                // 每个粒子：到了自己的延迟才开始非常慢地向目标汇聚
                const flyDuration = 2.7; // 每个粒子自身飞行时长，值越大越慢
                for(let i=0;i<PARTICLE_COUNT;i++){
                    const d = moveDelay[i];
                    if(nowSec < d){
                        // 还没轮到，留在底部
                        pa[i*3]   = startPos[i*3];
                        pa[i*3+1] = startPos[i*3+1];
                        pa[i*3+2] = startPos[i*3+2];
                    }else{
                        const dt = nowSec - d;
                        let p = Math.min(1.0, dt / flyDuration);
                        p = easeSlow(p);
                        pa[i*3]   = startPos[i*3]   + (targetPos[i*3]   - startPos[i*3]) * p;
                        pa[i*3+1] = startPos[i*3+1] + (targetPos[i*3+1] - startPos[i*3+1]) * p;
                        pa[i*3+2] = startPos[i*3+2] + (targetPos[i*3+2] - startPos[i*3+2]) * p;
                    }
                }
                posAttr.needsUpdate = true;

                // 全部基本汇聚完再弹出文字
                if(nowSec > 16.5){
                    showBirthText();
                }
            }

            effectComposer.render();
        }

        renderer.domElement.addEventListener("click", startAnim);
        renderer.domElement.addEventListener("touchstart", e=>{
            e.preventDefault();
            startAnim();
        });

        requestAnimationFrame(loop);
    </script>
</body>
</html>
