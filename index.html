<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>祝偏执生日快乐，身体健康，万事顺遂</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: #06060f;
        }
        .birthday-text{
            position: fixed;
            bottom: 10vh;
            width:100%;
            text-align:center;
            font-size: clamp(26px,7vw,44px);
            color: #ffdd77;
            font-weight:bold;
            z-index:10;
            pointer-events:none;
            text-shadow: 0 0 14px #ffaa33,0 0 28px #ff8822;
            opacity:0;
            transition: opacity 1.4s ease;
        }
        .birthday-text.show{
            opacity:1;
        }
    </style>
</head>
<body>
    <div class="birthday-text" id="birthText">祝偏执生日快乐</div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        const birthTextDom = document.getElementById("birthText");
        let animStarted = false;
        let animStartTs = 0;

        // ========== 普通HTML5 Audio，同域MP3 ==========
        let bgAudio = null;
        const AUDIO_VOLUME = 0.75;
        const AUDIO_SRC = "./1792042036066.mp3";

        function showBirthText(){
            birthTextDom.classList.add("show");
        }

        // ========== Three.js 场景 ==========
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x06060f);
        scene.fog = new THREE.FogExp2(0x06060f, 0.0022);
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(3.2, 2.4, 5.2);
        camera.lookAt(0, 1.2, 0);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ReinhardToneMapping;
        renderer.toneMappingExposure = 1.0;
        document.body.appendChild(renderer.domElement);

        const renderScene = new RenderPass(scene, camera);
        const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.7, 0.25, 0.15);
        bloomPass.threshold = 0.12;
        bloomPass.strength = 0.7;
        bloomPass.radius = 0.4;
        const effectComposer = new EffectComposer(renderer);
        effectComposer.addPass(renderScene);
        effectComposer.addPass(bloomPass);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.06;
        controls.autoRotate = false;
        controls.enableZoom = true;
        controls.zoomSpeed = 1.2;
        controls.rotateSpeed = 1.2;
        controls.target.set(0, 1.2, 0);

        const ambientLight = new THREE.AmbientLight(0x111122, 0.08);
        scene.add(ambientLight);
        const backLight = new THREE.PointLight(0xffaa66, 0.15);
        backLight.position.set(1.5, 2.5, 2);
        scene.add(backLight);
        const fillLight = new THREE.PointLight(0x6688ff, 0.1);
        fillLight.position.set(-1, 1.8, 2.5);
        scene.add(fillLight);
        const topHighlight = new THREE.PointLight(0xaaccff, 0.05);
        topHighlight.position.set(0, 2.0, 0.3);
        scene.add(topHighlight);

        // 背景星空
        const starCount = 2000;
        const starGeo = new THREE.BufferGeometry();
        const starPos = [];
        for (let i = 0; i < starCount; i++) {
            starPos.push((Math.random() - 0.5) * 200);
            starPos.push((Math.random() - 0.5) * 100);
            starPos.push((Math.random() - 0.5) * 80 - 40);
        }
        starGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(starPos), 3));
        const starMat = new THREE.PointsMaterial({ color: 0xaaccff, size: 0.07, transparent: true, opacity: 0.4 });
        const stars = new THREE.Points(starGeo, starMat);
        scene.add(stars);

        // 装饰光环
        const ambientRingGeo = new THREE.TorusGeometry(1.75, 0.015, 16, 120);
        const ambientRingMat = new THREE.MeshBasicMaterial({
            color: 0x335588,
            transparent: true,
            opacity: 0.25,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });
        const ambientRing = new THREE.Mesh(ambientRingGeo, ambientRingMat);
        ambientRing.rotation.x = Math.PI / 2;
        ambientRing.position.y = 0.5;
        scene.add(ambientRing);
        const ambientRing2Geo = new THREE.TorusGeometry(2.0, 0.01, 12, 100);
        const ambientRing2Mat = new THREE.MeshBasicMaterial({
            color: 0x553366,
            transparent: true,
            opacity: 0.2,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });
        const ambientRing2 = new THREE.Mesh(ambientRing2Geo, ambientRing2Mat);
        ambientRing2.rotation.x = Math.PI / 2;
        ambientRing2.rotation.z = 0.3;
        ambientRing2.position.y = 0.3;
        scene.add(ambientRing2);

        // 流星
        const shootingStars = [];
        const STAR_COUNT = 8;
        for (let i = 0; i < STAR_COUNT; i++) {
            const length = 0.15 + Math.random() * 0.25;
            const pointsCount = 8;
            const positionsArray = new Float32Array(pointsCount * 3);
            const startX = (Math.random() - 0.5) * 10;
            const startY = (Math.random() - 0.5) * 6 + 1;
            const startZ = (Math.random() - 0.5) * 6 - 2;
            const dir = new THREE.Vector3(
                -0.8 + Math.random() * 0.4,
                -0.6 + Math.random() * 0.3,
                -0.3 + Math.random() * 0.2
            ).normalize();
            const geometry = new THREE.BufferGeometry();
            const material = new THREE.LineBasicMaterial({
                color: new THREE.Color().setHSL(0.6 + Math.random() * 0.15, 0.7, 0.7),
                blending: THREE.AdditiveBlending,
                transparent: true,
                opacity: 0.3 + Math.random() * 0.4,
                depthWrite: false
            });
            for (let j = 0; j < pointsCount; j++) {
                const t = j / (pointsCount - 1);
                positionsArray[j * 3] = startX + dir.x * t * length;
                positionsArray[j * 3 + 1] = startY + dir.y * t * length;
                positionsArray[j * 3 + 2] = startZ + dir.z * t * length;
            }
            geometry.setAttribute('position', new THREE.BufferAttribute(positionsArray, 3));
            const line = new THREE.Line(geometry, material);
            scene.add(line);
            shootingStars.push({ line, dir, speed: 0.008 + Math.random() * 0.015, length, startX, startY, startZ, pointsCount, positionsArray });
        }

        // ========== 蓝色引导环 ==========
        const guideRingGroup = new THREE.Group();
        const guideRingGeo = new THREE.TorusGeometry(1.35, 0.025, 24, 160);
        const guideRingMat = new THREE.MeshBasicMaterial({
            color: 0x33bbff,
            transparent: true,
            opacity: 0.9,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });
        const guideRing = new THREE.Mesh(guideRingGeo, guideRingMat);
        guideRing.rotation.x = Math.PI / 2;
        guideRingGroup.add(guideRing);

        // 环周围蓝色粒子拖尾
        const guideParticlesGeo = new THREE.BufferGeometry();
        const guideParticleCount = 1200;
        const guidePositions = new Float32Array(guideParticleCount * 3);
        for (let i = 0; i < guideParticleCount; i++) {
            const angle = Math.random() * Math.PI * 2;
            const r = 1.0 + Math.random() * 0.55;
            guidePositions[i * 3] = Math.cos(angle) * r;
            guidePositions[i * 3 + 1] = (Math.random() - 0.5) * 0.35;
            guidePositions[i * 3 + 2] = Math.sin(angle) * r;
        }
        guideParticlesGeo.setAttribute('position', new THREE.BufferAttribute(guidePositions, 3));
        const guideParticlesMat = new THREE.PointsMaterial({
            size: 0.045,
            color: 0x55ccff,
            transparent: true,
            opacity: 0.85,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });
        const guideParticles = new THREE.Points(guideParticlesGeo, guideParticlesMat);
        guideRingGroup.add(guideParticles);

        guideRingGroup.position.y = -0.6;
        scene.add(guideRingGroup);

        // ========== 蛋糕粒子系统 ==========
        const PARTICLE_COUNT = 9800;
        let particleSystem = null;
        let cakePositions = [];
        let bottomScatterPositions = [];

        // 每个粒子的目标高度区间，用于被蓝环逐层激活
        let particleTargetY = [];
        let particleState = []; // 'rising' | 'settling' | 'done'
        let particleRiseProgress = [];
        let particleSettleProgress = [];
        let particleStartRiseTime = [];

        // 蓝环上升参数
        const RISE_START_Y = -0.6;
        const RISE_END_Y = 1.55;
        const RISE_DURATION = 7.0; // 蓝环从底到顶时间
        const RISE_BAND = 0.35;    // 环影响范围

        function addDiskPoints(count, y, rMin, rMax, biasCenter = 0.3) {
            const pts = [];
            for (let i = 0; i < count; i++) {
                let r;
                if (Math.random() < biasCenter) {
                    r = rMin + Math.random() * (rMax - rMin) * 0.5;
                } else {
                    r = rMin + Math.random() * (rMax - rMin);
                }
                const angle = Math.random() * Math.PI * 2;
                const x = Math.cos(angle) * r;
                const z = Math.sin(angle) * r;
                pts.push(new THREE.Vector3(x, y, z));
            }
            return pts;
        }
        function addSolidBase(count, yStart, yEnd, rMin, rMax) {
            const pts = [];
            for (let i = 0; i < count; i++) {
                const y = yStart + Math.random() * (yEnd - yStart);
                let r = rMin + Math.pow(Math.random(), 1.2) * (rMax - rMin);
                const angle = Math.random() * Math.PI * 2;
                const x = Math.cos(angle) * r;
                const z = Math.sin(angle) * r;
                pts.push(new THREE.Vector3(x, y, z));
            }
            return pts;
        }
        function generateCakePositions() {
            const positions = [];
            const bottomRMin = 0.96, bottomRMax = 1.14;
            const bottomY0 = -0.28, bottomY1 = 0.18;
            const midRMin = 0.73, midRMax = 0.86;
            const midY0 = 0.20, midY1 = 0.60;
            const topRMin = 0.52, topRMax = 0.65;
            const topY0 = 0.62, topY1 = 0.96;
            const candleR = 0.11;
            const candleY0 = 0.98, candleY1 = 1.50;
            const flameYCenter = 1.54;
            function addCylinderPoints(count, yMin, yMax, rMin, rMax, surfaceBias = 0.65) {
                const pts = [];
                for (let i = 0; i < count; i++) {
                    let r;
                    if (Math.random() < surfaceBias) {
                        r = rMin + Math.random() * (rMax - rMin);
                    } else {
                        r = rMin + Math.pow(Math.random(), 1.5) * (rMax - rMin);
                    }
                    const angle = Math.random() * Math.PI * 2;
                    const y = yMin + Math.random() * (yMax - yMin);
                    const x = Math.cos(angle) * r;
                    const z = Math.sin(angle) * r;
                    pts.push(new THREE.Vector3(x, y, z));
                }
                return pts;
            }
            const bottomCnt = Math.floor(PARTICLE_COUNT * 0.18);
            const midCnt = Math.floor(PARTICLE_COUNT * 0.14);
            const topCnt = Math.floor(PARTICLE_COUNT * 0.10);
            const candleCnt = Math.floor(PARTICLE_COUNT * 0.08);
            const solidBaseCnt = 480;
            const bottomDiskCnt = 300;
            const bottomTopDiskCnt = 280;
            const midTopDiskCnt = 240;
            const topTopDiskCnt = 220;
            const candleTopDiskCnt = 90;
            let decorCnt = PARTICLE_COUNT - bottomCnt - midCnt - topCnt - candleCnt - solidBaseCnt -
                bottomDiskCnt - bottomTopDiskCnt - midTopDiskCnt - topTopDiskCnt - candleTopDiskCnt;
            if (decorCnt < 0) decorCnt = 280;
            const bottomPts = addCylinderPoints(bottomCnt, bottomY0, bottomY1, bottomRMin, bottomRMax, 0.65);
            const midPts = addCylinderPoints(midCnt, midY0, midY1, midRMin, midRMax, 0.65);
            const topPts = addCylinderPoints(topCnt, topY0, topY1, topRMin, topRMax, 0.7);
            const candlePts = [];
            for (let i = 0; i < candleCnt; i++) {
                const r = candleR * Math.sqrt(Math.random());
                const angle = Math.random() * Math.PI * 2;
                const y = candleY0 + Math.random() * (candleY1 - candleY0);
                const x = Math.cos(angle) * r;
                const z = Math.sin(angle) * r;
                candlePts.push(new THREE.Vector3(x, y, z));
            }
            const solidBase = addSolidBase(solidBaseCnt, -0.45, -0.26, bottomRMin - 0.05, bottomRMax + 0.03);
            const bottomDisk = addDiskPoints(bottomDiskCnt, bottomY0 - 0.02, bottomRMin, bottomRMax, 0.4);
            const bottomTopDisk = addDiskPoints(bottomTopDiskCnt, bottomY1, bottomRMin, bottomRMax, 0.5);
            const midTopDisk = addDiskPoints(midTopDiskCnt, midY1, midRMin, midRMax, 0.5);
            const topTopDisk = addDiskPoints(topTopDiskCnt, topY1, topRMin, topRMax, 0.5);
            const candleTopDisk = addDiskPoints(candleTopDiskCnt, candleY1, 0, candleR, 0.6);
            const decorPts = [];
            const edgeSteps = Math.floor(decorCnt * 0.45);
            for (let i = 0; i < edgeSteps; i++) {
                const angle = Math.random() * Math.PI * 2;
                let r, y;
                const layer = Math.random();
                if (layer < 0.4) {
                    r = bottomRMax + 0.05;
                    y = bottomY1 + Math.sin(angle * 6) * 0.045;
                } else if (layer < 0.7) {
                    r = midRMax + 0.05;
                    y = midY1 + Math.sin(angle * 7) * 0.04;
                } else {
                    r = topRMax + 0.05;
                    y = topY1 + Math.sin(angle * 8) * 0.04;
                }
                const x = Math.cos(angle) * r;
                const z = Math.sin(angle) * r;
                decorPts.push(new THREE.Vector3(x, y, z));
            }
            const flameCnt = 240;
            for (let i = 0; i < flameCnt; i++) {
                const angle = Math.random() * Math.PI * 2;
                const rad = 0.11 * Math.random();
                const x = Math.cos(angle) * rad;
                const z = Math.sin(angle) * rad;
                const y = flameYCenter + Math.random() * 0.24;
                decorPts.push(new THREE.Vector3(x, y, z));
            }
            while (decorPts.length < decorCnt) {
                const angle = Math.random() * Math.PI * 2;
                const rad = 0.65 + Math.random() * 0.7;
                const y = 0.15 + Math.random() * 1.45;
                const x = Math.cos(angle) * rad;
                const z = Math.sin(angle) * rad;
                decorPts.push(new THREE.Vector3(x, y, z));
            }
            const all = [
                ...bottomPts, ...midPts, ...topPts, ...candlePts,
                ...solidBase, ...bottomDisk, ...bottomTopDisk, ...midTopDisk, ...topTopDisk, ...candleTopDisk,
                ...decorPts
            ];
            while (all.length < PARTICLE_COUNT) all(0, 0.8, 0));
            return all.slice(0, PARTICLE_COUNT).map(v => [v.x, v.y, v.z]);
        }

        // 底部初始散开位置：蓝圈从底部带起来
        function generateBottomScatterPositions() {
            const scatters = [];
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const angle = Math.random() * Math.PI * 2;
                const r = 0.3 + Math.random() * 1.6;
                const x = Math.cos(angle) * r;
                const z = Math.sin(angle) * r;
                const y = -0.55 + Math.random() * 0.25;
                scatters.push([x, y, z]);
            }
            return scatters;
        }

        function generateCakeColors(positions) {
            const colors = [];
            for (let i = 0; i < positions.length; i++) {
                const y = positions[i][1];
                let r, g, b;
                if (y < -0.3) { r = 0.6 + Math.random() * 0.2; g = 0.38 + Math.random() * 0.2; b = 0.22 + Math.random() * 0.2; }
                else if (y < -0.2) { r = 0.7 + Math.random() * 0.2; g = 0.45 + Math.random() * 0.22; b = 0.28 + Math.random() * 0.2; }
                else if (y < 0.2) { r = 0.8 + Math.random() * 0.15; g = 0.5 + Math.random() * 0.22; b = 0.32 + Math.random() * 0.18; }
                else if (y < 0.65) { r = 0.9 + Math.random() * 0.1; g = 0.65 + Math.random() * 0.18; b = 0.42 + Math.random() * 0.18; }
                else if (y < 1.0) { r = 0.95; g = 0.75 + Math.random() * 0.15; b = 0.5 + Math.random() * 0.2; }
                else { r = 0.95; g = 0.65 + Math.random() * 0.25; b = 0.38 + Math.random() * 0.25; }
                if (y > 1.52) { r =  = 0.45 + Math.random() * 0.45; b = 0.18; }
                colors.push(r, g, b);
            }
            return colors;
        }

        function initParticleSystem() {
            cakePositions = generateCakePositions();
            bottomScatterPositions = generateBottomScatterPositions();
            const initColors = generateCakeColors(cakePositions);
            const initPosArray = new Float32Array(PARTICLE_COUNT * 3);
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                initPosArray[i * 3] = bottomScatterPositions[i][0];
                initPosArray[i * 3 + 1] = bottomScatterPositions[i][1];
                initPosArray[i * 3 + 2] = bottomScatterPositions[i][2];

                particleTargetY[i] = cakePositions[i][1];
                particleState[i] = 'waiting';
                particleRiseProgress[i] = 0;
                particleSettleProgress[i] = 0;
                particleStartRiseTime[i] = -1;
            }
            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.BufferAttribute(initPosArray, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(new Float32Array(initColors), 3));
            const particleMat = new THREE.PointsMaterial({
                size: 0.038,
                vertexColors: true,
                blending: THREE.AdditiveBlending,
                transparent: true,
                depthWrite: false
            });
            particleSystem = new THREE.Points(geometry, particleMat);
            scene.add(particleSystem);
        }

        // 预初始化粒子数组
        for (let i = 0; i < PARTICLE_COUNT; i++) {
            particleTargetY[i] = 0;
            particleState[i] = 'waiting';
            particleRiseProgress[i] = 0;
            particleSettleProgress[i] = 0;
            particleStartRiseTime[i] = -1;
        }
        initParticleSystem();

        // ========== 点击开始：音频 + 蓝环上升 + 粒子聚拢 ==========
        async function startAnim(){
            if(animStarted) return;
            animStarted = true;
            animStartTs = performance.now() / 1000;

            // 普通Audio，点击手势里播放，同域
            bgAudio = new Audio(AUDIO_SRC);
            bgAudio.volume = AUDIO_VOLUME;
            bgAudio.loop = false;
            try{
                await bgAudio.play();
                console.log("✅音频播放");
            }catch(e){
                console.log("❌音频播放被拦截",e);
                alert("🔇没播放成功，可以再点一次画面");
            }
        }

        const posAttr = particleSystem.geometry.attributes.position;
        const posArr = posAttr.array;

        function easeInOut(t) {
            return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
        }
        function elasticOut(t) {
            if (t <= 0) return 0;
            if (t >= 1) return 1;
            const c4 = (2 * Math.PI) / 3;
            return Math.pow(2, -10 * t) * Math.sin((t - 0.075) * c4) + 1;
        }

        function loop(time){
            requestAnimationFrame(loop);
            controls.update();

            // 蓝环背景粒子轻微旋转
            guideParticles.rotation.y += 0.004;

            if(animStarted){
                const now = time / 1000;
                const totalElapsed = now - animStartTs;

                // 蓝环当前高度
                const ringY = RISE_START_Y + (RISE_END_Y - RISE_START_Y) * Math.min(1, totalElapsed / RISE_DURATION);
                guideRingGroup.position.y = ringY;
                guideRing.rotation.z += 0.012;

                let allDone = true;

                for(let i = 0; i < PARTICLE_COUNT; i++){
                    const tx = cakePositions[i][0];
                    const ty = cakePositions[i][1];
                    const tz = cakePositions[i][2];

                    if(particleState[i] === 'waiting'){
                        // 粒子是否进入蓝环影响带
                        if (Math.abs(ty - ringY) < RISE_BAND) {
                            particleState[i] = 'rising';
                            particleStartRiseTime[i] = totalElapsed;
                        }
                        // 保持底部初始位置
                        posArr[i*3]   = bottomScatterPositions[i][0];
                        posArr[i*3+1] = bottomScatterPositions[i][1];
                        posArr[i*3+2] = bottomScatterPositions[i][2];
                        allDone = false;
                    }
                    else if(particleState[i] === 'rising'){
                        allDone = false;
                        const riseDur = 1.1 + Math.random() * 0.35;
                        const t0 = totalElapsed - particleStartRiseTime[i];
                        let p = Math.min(1, t0 / riseDur);
                        p = easeInOut(p);

                        // 从底部位置上升到目标Y，同时XY Z逐渐靠近蛋糕目标点
                        const startX = bottomScatterPositions[i][0];
                        const startY = bottomScatterPositions[i][1];
                        const startZ = bottomScatterPositions[i][2];

                        posArr[i*3]   = startX + (tx - startX) * p;
                        posArr[i*3+1] = startY + (ty - startY) * p;
                        posArr[i*3+2] = startZ + (tz - startZ) * p;

                        if(p >= 1){
                            particleState[i] = 'settling';
                            particleStartRiseTime[i] = totalElapsed;
                        }
                    }
                    else if(particleState[i] === 'settling'){
                        allDone = false;
                        const settleDur = 1.6 + Math.random() * 0.9;
                        const t0 = totalElapsed - particleStartRiseTime[i];
                        let p = Math.min(1, t0 / settleDur);
                        p = elasticOut(p);

                        // 落点前轻微摆动后归位
                        const sway = Math.sin(p * Math.PI) * 0.035;
                        posArr[i*3]   = tx + sway * (Math.random() - 0.5);
                        posArr[i*3+1] = ty;
                        posArr[i*3+2] = tz + sway * (Math.random() - 0.5);

                        if(p >= 1){
                            particleState[i] = 'done';
                            posArr[i*3]   = tx;
                            posArr[i*3+1] = ty;
                            posArr[i*3+2] = tz;
                        }
                    }
                    else{
                        posArr[i*3]   = tx;
                        posArr[i*3+1] = ty;
                        posArr[i*3+2] = tz;
                    }
                }

                posAttr.needsUpdate = true;

                // 蓝环完全通过后，再等所有粒子归位，最后显示文字
                if(ringY >= RISE_END_Y && allDone){
                    showBirthText();
                }
            }

            effectComposer.render();
        }

        renderer.domElement.addEventListener("click", startAnim);
        renderer.domElement.addEventListener("touchstart", e=>{e.preventDefault();startAnim();});
        requestAnimationFrame(loop);
    </script>
</body>
</html>
